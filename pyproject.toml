[project]
name = "llm-learning"
version = "0.1.0"
description = "Hands-on learning of LLM concepts with Python"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "tiktoken>=0.13.0",
]

[project.scripts]
tokenize-basic = "tokenization.basic_tokenizers:main"
tokenize-bpe = "tokenization.bpe_tokenizer:main"
tokenize-tiktoken = "tokenization.tiktoken_comparison:main"

[dependency-groups]
dev = [
    "pyrefly>=1.2.0",
    "ruff>=0.16.2",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
docstring-code-format = true

[tool.pyrefly]
project_includes = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tokenization"]
